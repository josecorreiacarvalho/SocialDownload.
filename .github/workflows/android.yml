name: Gerar APK SocialDownload

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar projeto Android
        run: npx expo prebuild --platform android --clean
        env:
          CI: "1"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Permissao do Gradle
        run: chmod +x android/gradlew

      - name: Gerar APK Release
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Preparar APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/SocialDownload.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: SocialDownload
          path: apk/SocialDownload.apk
          retention-days: 30